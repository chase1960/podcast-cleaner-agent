[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "podcast-cleaner-agent"
version = "0.1.0"
description = "播客清洗与个人知识树 Agent：结构化笔记、跨条目关联、每日简报卡片"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
  "feedparser>=6.0.10",
  "requests>=2.31.0",
  "PyYAML>=6.0",
  "openai>=1.30.0",
]

[tool.setuptools.packages.find]
where = ["src"]
